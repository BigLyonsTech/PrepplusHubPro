spring.application.name=prepplushub-backend
server.port=${PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=prepplushubpro
spring.data.mongodb.auto-index-creation=true

springdoc.swagger-ui.path=/docs

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

paystack.secret-key=${PAYSTACK_SECRET_KEY:}

anthropic.api-key=${ANTHROPIC_API_KEY:}

# Dev-only: when true, OTP codes are echoed back in auth API responses instead of
# requiring real email delivery (which isn't wired up yet). Never enable in production.
app.dev-mode=${APP_DEV_MODE:false}

# Comma-separated list of origins allowed to call this API (CORS).
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

server.error.include-message=always
server.error.include-binding-errors=always
